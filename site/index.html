<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f1eb" />
    <meta
      name="description"
      content="Random boxes for perspective drawing practice."
    />
    <title>Cubey</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <canvas
        role="img"
        aria-label="A shaded rectangular box in perspective for drawing practice."
      ></canvas>
      <button type="button" aria-label="Generate another box">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 7v5h-5M4 17v-5h5" />
          <path d="M6.1 6.1A8.3 8.3 0 0 1 20 12M4 12a8.3 8.3 0 0 0 13.9 5.9" />
        </svg>
      </button>
      <noscript>Enable JavaScript to generate drawing references.</noscript>
    </main>
  </body>
</html>
