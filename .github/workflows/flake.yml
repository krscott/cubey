name: Nix flake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: nix develop -c just check

      - name: Build
        run: nix build -L

      - name: Serve packaged site
        run: |
          nix run -L >/tmp/cubey-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/ -o /tmp/cubey-index.html
          grep -q '<title>Cubey</title>' /tmp/cubey-index.html
